<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 48" fill="currentColor" aria-label="Shell">
  <!-- Shell pecten shell icon simplified -->
  <g transform="translate(4, 2)">
    <!-- Central stripe -->
    <rect x="17" y="2" width="6" height="40" rx="1"/>
    <!-- Left stripes -->
    <rect x="9" y="6" width="5" height="36" rx="1"/>
    <rect x="1" y="12" width="5" height="30" rx="1"/>
    <!-- Right stripes -->
    <rect x="26" y="6" width="5" height="36" rx="1"/>
    <rect x="34" y="12" width="5" height="30" rx="1"/>
    <!-- Bottom arc cap -->
    <ellipse cx="20" cy="42" rx="19" ry="4" opacity="0.3"/>
  </g>
  <!-- SHELL wordmark -->
  <text x="48" y="30" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="16" letter-spacing="0.5">SHELL</text>
</svg>
